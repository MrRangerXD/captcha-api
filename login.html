<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Captcha Solver — Login</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="gate" class="gate">
    <div class="gate-card">
      <div class="logo">⚡ <span>captcha<b>solver</b></span></div>
      <p class="muted" id="gateSub">Admin login</p>

      <div id="setupForm" class="hidden">
        <label>Admin password banao</label>
        <input type="password" id="setupPw" placeholder="min 6 characters" />
        <label>Confirm</label>
        <input type="password" id="setupPw2" placeholder="repeat password" />
        <button class="btn primary" id="doSetup">Create &amp; Enter</button>
      </div>

      <div id="loginForm" class="hidden">
        <label>Admin password</label>
        <input type="password" id="loginPw" placeholder="••••••••" />
        <button class="btn primary" id="doLogin">Enter</button>
      </div>

      <div class="err" id="gateErr"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
